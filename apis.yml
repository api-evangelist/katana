aid: katana
name: Katana
description: >-
  Katana is a cloud manufacturing ERP and inventory management platform for
  product businesses. It gives makers and small-to-midsize manufacturers
  real-time inventory control across multiple locations and sales channels,
  production and manufacturing-order planning, purchasing and demand
  forecasting, warehouse and bin management with barcode workflows, and lot/
  serial-number traceability. Katana connects to Shopify, Amazon, QuickBooks
  Online, Xero, WooCommerce, BigCommerce, HubSpot and 50+ other tools, and
  exposes a full REST API (documented with OpenAPI 3.0) plus HMAC-signed
  webhooks so integrators can sync sales orders, purchase orders, manufacturing
  orders, products, variants, materials and stock programmatically. Added to the
  API Evangelist network as a portfolio company of Northzone and enriched from
  its public developer surface.
url: https://raw.githubusercontent.com/api-evangelist/katana/refs/heads/main/apis.yml
