        '200':
          description: Return value of BomRowController.updateBomRow
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BomRowUpdateDto'
        required: true
        x-parameter-index: 1
      operationId: BomRowController.updateBomRow
