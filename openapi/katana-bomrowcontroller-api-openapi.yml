      tags:
      - BomRowController
      responses:
        '200':
          description: Return value of BomRowController.getBomRows
      operationId: BomRowController.getBomRows
      parameters:
      - name: pagination
        in: query
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      - name: dateFilter
        in: query
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      - name: id
        in: query
        schema:
          type: string
      - name: product_variant_id
        in: query
        schema:
          type: integer
          format: int32
      - name: product_item_id
        in: query
        schema:
          type: integer
          format: int32
      - name: ingredient_variant_id
        in: query
        schema:
          type: integer
          format: int32
      summary: Bom row controller get bom rows
      x-summary-source: derived
components:
