                type: object
                properties:
                  product_item_id:
                    type: integer
                    minimum: 1
                    maximum: 2147483647
                  product_variant_id:
                    type: integer
                    minimum: 1
                    maximum: 2147483647
                  ingredient_variant_id:
                    type: integer
                    minimum: 1
                    maximum: 2147483647
                  quantity:
                    type:
                    - number
                    - 'null'
                    minimum: 0
                    maximum: 100000000000000000
                  notes:
                    type:
                    - string
                    - 'null'
                    maxLength: 255
                required:
                - product_item_id
                - product_variant_id
                - ingredient_variant_id
                additionalProperties: false
      required:
      - data
      additionalProperties: false
