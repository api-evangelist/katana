openapi: 3.2.0
info:
  title: katana-api-gateway Bin Transfer Controller API
  version: 0.0.1
  description: public api
  contact: {}
servers:
- url: https://api.katanamrp.com/v1
tags:
- name: BinTransferController
paths:
  /bin_transfers/{id}/status:
    patch:
      x-controller-name: BinTransferController
      x-operation-name: updateStatus
      tags:
      - BinTransferController
      responses:
        '200':
          description: Return value of BinTransferController.updateStatus
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBinTransferStatusDto'
        required: true
        x-parameter-index: 1
      operationId: BinTransferController.updateStatus
      parameters:
      - name: id
        in: path
        schema:
          type: integer
          format: int32
        required: true
      summary: Bin transfer controller update status
      x-summary-source: derived
  /bin_transfers/{id}:
    patch:
      x-controller-name: BinTransferController
      x-operation-name: updateById
      tags:
      - BinTransferController
      responses:
        '200':
          description: Return value of BinTransferController.updateById
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBinTransferDto'
        required: true
        x-parameter-index: 1
      operationId: BinTransferController.updateById
      parameters:
      - name: id
        in: path
        schema:
          type: integer
          format: int32
        required: true
      summary: Bin transfer controller update by id
      x-summary-source: derived
    get:
      x-controller-name: BinTransferController
      x-operation-name: findById
      tags:
      - BinTransferController
      responses:
        '200':
          description: Return value of BinTransferController.findById
      operationId: BinTransferController.findById
      parameters:
      - name: id
        in: path
        schema:
          type: integer
          format: int32
        required: true
      summary: Bin transfer controller find by id
      x-summary-source: derived
    delete:
      x-controller-name: BinTransferController
      x-operation-name: deleteById
      tags:
      - BinTransferController
      responses:
        '200':
          description: Return value of BinTransferController.deleteById
      operationId: BinTransferController.deleteById
      parameters:
      - name: id
        in: path
        schema:
          type: integer
          format: int32
        required: true
      summary: Bin transfer controller delete by id
      x-summary-source: derived
  /bin_transfers:
    post:
      x-controller-name: BinTransferController
      x-operation-name: create
      tags:
      - BinTransferController
      responses:
        '200':
          description: Return value of BinTransferController.create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBinTransferDto'
        required: true
      operationId: BinTransferController.create
      summary: Bin transfer controller create
      x-summary-source: derived
    get:
      x-controller-name: BinTransferController
      x-operation-name: findAndPaginate
      tags:
      - BinTransferController
      responses:
        '200':
          description: Return value of BinTransferController.findAndPaginate
      operationId: BinTransferController.findAndPaginate
      parameters:
      - name: pagination
        in: query
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      - name: dateFilter
        in: query
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      - name: ids
        in: query
        schema:
          type: array
          items:
            type: integer
            maximum: 2147483647
      - name: bin_transfer_number
        in: query
        schema:
          type: string
      - name: location_id
        in: query
        schema:
          type: integer
          format: int32
      - name: status
        in: query
        schema:
          enum:
          - CREATED
          - IN_TRANSIT
          - DONE
          type: string
      - name: include_deleted
        in: query
        schema:
          type: boolean
      summary: Bin transfer controller find and paginate
      x-summary-source: derived
components:
  schemas:
    TraceabilityInputDto:
      title: TraceabilityInputDto
      type: object
      properties:
        batch_id:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 2147483647
        serial_number_id:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 2147483647
        quantity:
          allOf:
          - anyOf:
            - type: number
              minimum: 0
            - type: string
              pattern: ^[0-9]+?\.?[0-9]*$
          - anyOf:
            - type: number
              not:
                const: 0
            - type: string
              not:
                pattern: ^(-|)[0]+?\.?[0]*$
      additionalProperties: false
    UpdateBinTransferDto:
      title: UpdateBinTransferDto
      type: object
      properties:
        bin_transfer_number:
          type: string
          minLength: 1
          maxLength: 255
        location_id:
          type: integer
          minimum: 0
          maximum: 2147483647
        created_date:
          type:
          - string
          - 'null'
          format: date-time
        departed_at:
          type:
          - string
          - 'null'
          format: date-time
        arrived_at:
          type:
          - string
          - 'null'
          format: date-time
        additional_info:
          type:
          - string
          - 'null'
          minLength: 0
      additionalProperties: false
    UpdateBinTransferStatusDto:
      title: UpdateBinTransferStatusDto
      type: object
      properties:
        status:
          type: string
          enum:
          - CREATED
          - IN_TRANSIT
          - DONE
      required:
      - status
      additionalProperties: false
    CreateBinTransferDto:
      title: CreateBinTransferDto
      type: object
      properties:
        bin_transfer_number:
          type: string
          minLength: 1
          maxLength: 255
        location_id:
          type: integer
          minimum: 0
          maximum: 2147483647
        created_date:
          type:
          - string
          - 'null'
          format: date-time
        additional_info:
          type:
          - string
          - 'null'
          minLength: 0
        bin_transfer_rows:
          type: array
          maxItems: 250
          items:
            title: CreateNestedBinTransferRowDto
            type: object
            properties:
              variant_id:
                type: integer
                minimum: 0
                maximum: 2147483647
              quantity:
                allOf:
                - anyOf:
                  - type: number
                    minimum: 0
                  - type: string
                    pattern: ^[0-9]+?\.?[0-9]*$
                - anyOf:
                  - type: number
                    not:
                      const: 0
                  - type: string
                    not:
                      pattern: ^(-|)[0]+?\.?[0]*$
              source_bin_location_id:
                type:
                - number
                - 'null'
                minimum: 0
                maximum: 2147483647
              target_bin_location_id:
                type:
                - number
                - 'null'
                minimum: 0
                maximum: 2147483647
              traceability:
                type: array
                items:
                  $ref: '#/components/schemas/TraceabilityInputDto'
            required:
            - variant_id
            - quantity
            definitions:
              TraceabilityInputDto:
                title: TraceabilityInputDto
                type: object
                properties:
                  batch_id:
                    type:
                    - number
                    - 'null'
                    minimum: 0
                    maximum: 2147483647
                  serial_number_id:
                    type:
                    - number
                    - 'null'
                    minimum: 0
                    maximum: 2147483647
                  quantity:
                    allOf:
                    - anyOf:
                      - type: number
                        minimum: 0
                      - type: string
                        pattern: ^[0-9]+?\.?[0-9]*$
                    - anyOf:
                      - type: number
                        not:
                          const: 0
                      - type: string
                        not:
                          pattern: ^(-|)[0]+?\.?[0]*$
                additionalProperties: false
            additionalProperties: false
      required:
      - location_id
      additionalProperties: false
